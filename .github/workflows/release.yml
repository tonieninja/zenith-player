name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Import Authenticode PFX (optional)
        shell: pwsh
        env:
          ZENITH_CODESIGN_PFX_BASE64: ${{ secrets.ZENITH_CODESIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ZENITH_CODESIGN_PFX_BASE64)) {
            Write-Host 'No ZENITH_CODESIGN_PFX_BASE64 - unsigned CI Windows build'
            exit 0
          }
          ./scripts/prepare-gha-signing.ps1
      - name: Build Windows x64 + x86 (one NSIS, MSI, portable each)
        shell: pwsh
        env:
          ZENITH_CODESIGN_PFX_BASE64: ${{ secrets.ZENITH_CODESIGN_PFX_BASE64 }}
          ZENITH_CODESIGN_PASSWORD: ${{ secrets.ZENITH_CODESIGN_PASSWORD }}
          ZENITH_CODESIGN_THUMBPRINT: ${{ secrets.ZENITH_CODESIGN_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ZENITH_CODESIGN_PFX_BASE64) -and
              [string]::IsNullOrWhiteSpace($env:ZENITH_CODESIGN_THUMBPRINT)) {
            $env:ZENITH_SKIP_CODESIGN = '1'
          }
          pnpm dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rezip portable
        shell: pwsh
        run: ./scripts/repack-windows-portable.ps1
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-artifacts/windows/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build macOS (app + dmg)
        run: pnpm tauri build
      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then TAG=aarch64; else TAG=x64; fi
          mkdir -p dist-artifacts/macos
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          test -n "$DMG" && test -f "$DMG"
          cp -f "$DMG" "dist-artifacts/macos/Zenith_${VERSION}_macos_${TAG}.dmg"
          if ls src-tauri/target/release/bundle/macos/*.app >/dev/null 2>&1; then
            ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/*.app \
              "dist-artifacts/macos/Zenith-${VERSION}-macos-${TAG}.zip"
          fi
          ls -la dist-artifacts/macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist-artifacts/macos/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build Linux (AppImage + deb)
        run: pnpm tauri build --bundles appimage,deb
      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist-artifacts/linux
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          test -n "$APPIMAGE" && test -f "$APPIMAGE"
          test -n "$DEB" && test -f "$DEB"
          cp -f "$APPIMAGE" "dist-artifacts/linux/Zenith_${VERSION}_amd64.AppImage"
          cp -f "$DEB" "dist-artifacts/linux/Zenith_${VERSION}_amd64.deb"
          chmod +x "dist-artifacts/linux/Zenith_${VERSION}_amd64.AppImage"
          ls -la dist-artifacts/linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist-artifacts/linux/*

  publish:
    needs: [windows, macos, linux]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List release files
        run: find artifacts -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Independent desktop music player. Not affiliated with Google or YouTube.

            Legal notice: see DISCLAIMER.md in this repository. Use is subject to
            YouTube's and Google's terms.

            Windows: prefer the NSIS installer. SmartScreen quietens after the
            publisher builds reputation. Optional SignPath / Azure signing can be
            added later via repository secrets.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
