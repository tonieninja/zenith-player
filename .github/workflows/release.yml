name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Import Authenticode PFX
        if: ${{ secrets.ZENITH_CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          ZENITH_CODESIGN_PFX_BASE64: ${{ secrets.ZENITH_CODESIGN_PFX_BASE64 }}
        run: ./scripts/prepare-gha-signing.ps1
      - name: Build Windows x64 + x86 (one NSIS, MSI, portable each)
        env:
          ZENITH_SKIP_CODESIGN: ${{ secrets.ZENITH_CODESIGN_PFX_BASE64 == '' && '1' || '0' }}
          ZENITH_CODESIGN_PASSWORD: ${{ secrets.ZENITH_CODESIGN_PASSWORD }}
          ZENITH_CODESIGN_THUMBPRINT: ${{ secrets.ZENITH_CODESIGN_THUMBPRINT }}
        run: pnpm dist:win
      - name: Azure Artifact Signing
        if: ${{ secrets.SIGNPATH_API_TOKEN == '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT != '' && secrets.AZURE_TRUSTED_SIGNING_PROFILE != '' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign with Azure Artifact Signing
        if: ${{ secrets.SIGNPATH_API_TOKEN == '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT != '' && secrets.AZURE_TRUSTED_SIGNING_PROFILE != '' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: dist-artifacts/windows
          files-folder-filter: exe,dll,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Rezip portable after extra signing
        shell: pwsh
        run: ./scripts/repack-windows-portable.ps1
      - name: Upload Windows artifacts
        id: upload-windows
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-artifacts/windows/*

  sign-windows-signpath:
    needs: windows
    runs-on: ubuntu-latest
    if: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && secrets.ZENITH_CODESIGN_PFX_BASE64 == '' }}
    steps:
      - name: Sign with SignPath (free OSS)
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: signed-windows/**

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build macOS (app + dmg)
        run: pnpm tauri build
      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then TAG=aarch64; else TAG=x64; fi
          mkdir -p dist-artifacts/macos
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          test -n "$DMG" && test -f "$DMG"
          cp -f "$DMG" "dist-artifacts/macos/Zenith_${VERSION}_macos_${TAG}.dmg"
          if ls src-tauri/target/release/bundle/macos/*.app >/dev/null 2>&1; then
            ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/*.app \
              "dist-artifacts/macos/Zenith-${VERSION}-macos-${TAG}.zip"
          fi
          ls -la dist-artifacts/macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist-artifacts/macos/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build Linux (AppImage + deb)
        run: pnpm tauri build --bundles appimage,deb
      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist-artifacts/linux
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          test -n "$APPIMAGE" && test -f "$APPIMAGE"
          test -n "$DEB" && test -f "$DEB"
          cp -f "$APPIMAGE" "dist-artifacts/linux/Zenith_${VERSION}_amd64.AppImage"
          cp -f "$DEB" "dist-artifacts/linux/Zenith_${VERSION}_amd64.deb"
          chmod +x "dist-artifacts/linux/Zenith_${VERSION}_amd64.AppImage"
          ls -la dist-artifacts/linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist-artifacts/linux/*

  publish:
    needs: [windows, macos, linux, sign-windows-signpath]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prefer SignPath-signed Windows bits
        run: |
          if [ -d artifacts/windows-signed ]; then
            rm -rf artifacts/windows
          fi
          find artifacts -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Independent desktop music player. Not affiliated with Google or YouTube.

            Legal notice: see DISCLAIMER.md in this repository. Use is subject to
            YouTube's and Google's terms.

            Windows: prefer the NSIS installer. SmartScreen quietens after the
            publisher builds reputation. Free OSS signing is SignPath Foundation
            when that integration is enabled.

            Free code signing provided by SignPath.io, certificate by SignPath Foundation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
