name: build
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'assets/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'assets/**', 'LICENSE']
  workflow_dispatch:
# nowy push na main przerywa poprzedni przebieg, tagów nie ruszamy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: write
env:
  # paczki budujemy tylko dla tagów i na żądanie, zwykły push na main to same testy
  BUNDLE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev patchelf libudev-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libasound2-dev \
            rpm libfuse2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: e2e (phone remote page, Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: build
        if: env.BUNDLE == 'true'
        shell: bash
        run: |
          # bez bitu wykonywania AppImage nie otworzy żadnego linku; repo nie zawsze go przechowuje
          chmod +x src-tauri/linux/xdg-open
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --bundles deb,appimage,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            pnpm tauri build --bundles deb,appimage,rpm
          fi
      - uses: actions/upload-artifact@v7
        if: env.BUNDLE == 'true'
        with:
          name: bundle-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sig

  macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: build
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            pnpm tauri build --target universal-apple-darwin --bundles app,dmg
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: x64 }
          - { target: i686-pc-windows-msvc, arch: x86 }
          # cross z x64: rquickjs ma gotowe bindingi dla tego celu, ring bierze clang z obrazu runnera
          - { target: aarch64-pc-windows-msvc, arch: arm64 }
    runs-on: windows-latest
    env:
      # podpis SignPath tylko dla tagów i po ustawieniu zmiennych repo; bez nich build idzie jak dotąd, bez podpisu
      SIGNPATH: ${{ vars.SIGNPATH_PROJECT_SLUG != '' && startsWith(github.ref, 'refs/tags/v') }}
      REL: src-tauri/target/${{ matrix.target }}/release
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri, key: '${{ matrix.target }}' }
      - run: pnpm install --frozen-lockfile
      - name: rust tests (x64, kod tylko dla Windows)
        if: matrix.arch == 'x64'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: build installer
        if: env.SIGNPATH != 'true'
        shell: bash
        env:
          ZENITH_SKIP_CODESIGN: '1'
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --target ${{ matrix.target }} --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            pnpm tauri build --target ${{ matrix.target }} --bundles nsis,msi
          fi
          mkdir -p portable
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/${{ matrix.target }}/release/zenith-player.exe "portable/Zenith_${V}_${{ matrix.arch }}_portable.exe"
          # portable aktualizuje się sam z tego pliku, więc potrzebuje podpisu jak instalatory
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri signer sign "portable/Zenith_${V}_${{ matrix.arch }}_portable.exe"
          fi
      - uses: actions/upload-artifact@v7
        if: env.SIGNPATH != 'true'
        with:
          name: bundle-windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig
            portable/*.exe
            portable/*.sig

      # instalatory pakują exe, więc SignPath podpisuje go przed nimi, a potem same instalatory
      - name: build exe + msi (SignPath)
        if: env.SIGNPATH == 'true'
        shell: bash
        env:
          ZENITH_SKIP_CODESIGN: '1'
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          # MSI od razu, bo Tauri wpisuje typ MSI do kopii exe w środku, a SignPath podpisze ją przy MSI
          pnpm tauri build --target ${{ matrix.target }} --bundles msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "V=$V" >> "$GITHUB_ENV"
          mkdir -p sign-exe
          cp "$REL/zenith-player.exe" "sign-exe/Zenith_${V}_${{ matrix.arch }}_portable.exe"
          node scripts/bundle-type-variant.mjs "$REL/zenith-player.exe" sign-exe/zenith-player.exe NSS
      - id: up-exe
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with: { name: 'unsigned-exe-${{ matrix.arch }}', path: sign-exe/ }
      - name: sign exe (SignPath)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.up-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe
          parameters: |
            version: "${{ env.V }}"
      - name: build nsis from signed exe (SignPath)
        if: env.SIGNPATH == 'true'
        shell: bash
        env:
          ZENITH_SKIP_CODESIGN: '1'
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          cp signed-exe/zenith-player.exe "$REL/zenith-player.exe"
          # bez --no-binary-patching Tauri przepisałby typ paczki w exe i zniszczył podpis
          pnpm tauri bundle --target ${{ matrix.target }} --bundles nsis --no-binary-patching --config '{"bundle":{"createUpdaterArtifacts":false}}'
          mkdir -p sign-inst
          cp "$REL"/bundle/nsis/*-setup.exe "$REL"/bundle/msi/*.msi sign-inst/
      - id: up-inst
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with: { name: 'unsigned-installers-${{ matrix.arch }}', path: sign-inst/ }
      - name: sign installers (SignPath)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.up-inst.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-inst
          parameters: |
            version: "${{ env.V }}"
      - name: verify + updater signatures (SignPath)
        if: env.SIGNPATH == 'true'
        shell: bash
        run: |
          mkdir -p out/nsis out/msi out/portable
          cp signed-inst/*-setup.exe out/nsis/
          cp signed-inst/*.msi out/msi/
          cp signed-exe/Zenith_*_portable.exe out/portable/
          powershell -NoProfile -Command '$bad = Get-ChildItem out -Recurse -File | Get-AuthenticodeSignature | Where-Object Status -ne Valid; if ($bad) { $bad | Format-Table Path,Status; exit 1 }'
          # minisign dopiero po Authenticode, inaczej .sig aktualizatora nie pasuje do pliku z wydania
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for f in out/nsis/* out/msi/* out/portable/*; do pnpm tauri signer sign "$f"; done
          fi
      - uses: actions/upload-artifact@v7
        if: env.SIGNPATH == 'true'
        with:
          name: bundle-windows-${{ matrix.arch }}
          path: |
            out/nsis/*
            out/msi/*
            out/portable/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dl }
      - name: merge bundles
        shell: bash
        run: |
          mkdir -p bundle
          for d in deb appimage rpm dmg macos nsis msi portable; do mkdir -p "bundle/$d"; done
          find dl -type f | while read -r f; do
            case "$f" in
              */deb/*) cp "$f" bundle/deb/ ;;
              */appimage/*) cp "$f" bundle/appimage/ ;;
              */dmg/*) cp "$f" bundle/dmg/ ;;
              */macos/*) cp "$f" bundle/macos/ ;;
              */nsis/*) cp "$f" bundle/nsis/ ;;
              */msi/*) cp "$f" bundle/msi/ ;;
              */rpm/*) cp "$f" bundle/rpm/ ;;
              */portable/*) cp "$f" bundle/portable/ ;;
            esac
          done
          find bundle -type f | sort
      - name: latest.json
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          node scripts/make-latest-json.mjs bundle "$V" "${GITHUB_REF_NAME}" > bundle/latest.json
          cat bundle/latest.json
      - name: checksums
        run: |
          cd bundle
          find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: zenith-release
          path: bundle
      - name: publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            bundle/deb/*
            bundle/appimage/*
            bundle/dmg/*
            bundle/macos/*
            bundle/nsis/*
            bundle/msi/*
            bundle/rpm/*
            bundle/portable/*
            bundle/latest.json
            bundle/SHA256SUMS
