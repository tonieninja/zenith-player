name: Idea
description: Something Zenith should do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What it should do and when you'd use it.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What you do now instead
      description: Optional. Helps to know what's annoying about it today.
