<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon-256.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Zenith">
<meta name="mobile-web-app-capable" content="yes">
<title>Zenith Remote</title>
<style>
:root{--bg:#0c0e14;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.11);--txt:#eef2fb;--mut:#8b93a7;--a1:#7eb4ff;--a2:#4d8cff;--a3:#2f6fd4;--glow:rgba(77,140,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#bgart{position:fixed;inset:-20%;background-size:cover;background-position:center;filter:blur(60px) saturate(1.4);opacity:.35;z-index:-1;transition:background-image .4s}
.wrap{max-width:520px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header img{width:28px;height:28px;border-radius:8px}
header b{font-size:17px;letter-spacing:.3px}
#dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#d44}
#dot.on{background:#3ecf8e;box-shadow:0 0 8px #3ecf8e}
.cover{width:100%;aspect-ratio:1;border-radius:18px;background:var(--card) center/cover no-repeat;box-shadow:0 18px 50px rgba(0,0,0,.5)}
h1{font-size:21px;margin:18px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:var(--mut);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:10px}
.prog{margin-top:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--a1) var(--p,0%),rgba(255,255,255,.16) var(--p,0%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--glow)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums}
.ctl{justify-content:space-between;margin:14px 4px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.ib:active{background:var(--card2)}
.ib svg{width:26px;height:26px;fill:currentColor}
.ib.sm svg{width:21px;height:21px}
.ib.on{color:var(--a1)}
.play{width:74px;height:74px;border-radius:50%;background:linear-gradient(180deg,var(--a1),var(--a3));box-shadow:0 8px 26px var(--glow);display:grid;place-items:center}
.play svg{width:34px;height:34px;fill:#fff}
.vol{gap:12px;margin:6px 4px 0}
.vol svg{width:20px;height:20px;fill:var(--mut);flex:none}
.tabs{display:flex;gap:6px;margin:24px 0 12px;background:var(--card);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:9px;border-radius:9px;color:var(--mut);font-weight:600;font-size:14px}
.tabs button.act{background:var(--card2);color:var(--txt)}
.list{display:flex;flex-direction:column;gap:2px}
#queue,#lyr{max-height:52vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ctl{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:6px 4px}
.it{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;text-align:left;width:100%}
.it:active,.it.cur{background:var(--card)}
.it.cur .t{color:var(--a1)}
.it .ph{width:44px;height:44px;border-radius:7px;background:var(--card);flex:none}
.it img{width:44px;height:44px;border-radius:7px;object-fit:cover;background:var(--card);flex:none}
.it .m{min-width:0;flex:1}
.it .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .acts{display:flex;gap:2px}
.it .acts button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.it .acts svg{width:20px;height:20px;fill:currentColor}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:var(--card);color:var(--txt);font:inherit;font-size:15px;outline:none}
.search:focus{border-color:var(--a2)}
.empty{color:var(--mut);text-align:center;padding:24px 0;font-size:14px}
#pin{position:fixed;inset:0;background:rgba(8,9,13,.92);display:none;align-items:center;justify-content:center;z-index:5}
#pin.show{display:flex}
#pin .box{background:#141824;padding:24px;border-radius:16px;width:min(320px,90vw);text-align:center}
#pin input{margin:14px 0;text-align:center;letter-spacing:6px;font-size:22px}
.btn{background:linear-gradient(180deg,var(--a1),var(--a3));color:#fff;padding:11px 20px;border-radius:11px;font-weight:600;width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2030;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.lyr{display:flex;flex-direction:column;gap:6px;padding:4px 2px 30px}
.lyr p{margin:0;font-size:18px;line-height:1.35;font-weight:600;color:rgba(238,242,251,.38);transition:color .25s}
.lyr p.on{color:var(--txt)}
.lyr p.past{color:rgba(238,242,251,.6)}
.lyr pre{white-space:pre-wrap;font:inherit;font-size:16px;line-height:1.5;color:var(--txt);margin:0}
#sleepbtn{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;margin:8px auto 0;padding:6px 12px;border-radius:20px;background:var(--card)}
#sleepbtn.on{color:var(--a1)}
#sleepbtn svg{width:16px;height:16px;fill:currentColor}
#sheet{position:fixed;inset:0;background:rgba(8,9,13,.7);display:none;align-items:flex-end;z-index:4}
#sheet.show{display:flex}
#sheet .box{background:#141824;width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
#sheet .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
#sheet .opts button{padding:12px;border-radius:12px;background:var(--card);font-weight:600}
.scrub{background:var(--card2)!important}
</style>
</head>
<body>
<div id="bgart"></div>
<div class="wrap">
  <header><img src="/icon.png" alt=""><b>Zenith Remote</b><span id="dot" title="connection"></span></header>
  <div class="cover" id="cover"></div>
  <h1 id="title">Nothing playing</h1>
  <div class="artist" id="artist">&nbsp;</div>
  <div class="prog">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div class="row ctl">
    <button class="ib sm" id="shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1z"/></svg></button>
    <button class="ib" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="play" id="toggle" aria-label="Play/Pause"><svg viewBox="0 0 24 24" id="picon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ib" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    <button class="ib sm" id="like" aria-label="Like"><svg viewBox="0 0 24 24"><path id="heart" d="M16.5 3c-1.7 0-3.4.8-4.5 2.1C10.9 3.8 9.2 3 7.5 3 4.4 3 2 5.4 2 8.5c0 3.8 3.4 6.9 8.6 11.5l1.4 1.3 1.4-1.3C18.6 15.4 22 12.3 22 8.5 22 5.4 19.6 3 16.5 3zm-4.4 15.6-.1.1-.1-.1C7.1 14.2 4 11.4 4 8.5 4 6.5 5.5 5 7.5 5c1.5 0 3 1 3.6 2.4h1.9C13.5 6 15 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.9-3.1 5.7-7.9 10.1z"/></svg></button>
  </div>
  <button id="sleepbtn" aria-label="Sleep timer"><svg viewBox="0 0 24 24"><path d="M12.3 2a10 10 0 1 0 9.7 12.6A8 8 0 0 1 12.3 2z"/></svg><span id="sleeptxt">Sleep timer</span></button>
  <div class="row vol">
    <button id="mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path id="volpath" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
    <input type="range" id="vol" min="0" max="100" value="50" aria-label="Volume">
    <span id="volv" style="color:var(--mut);font-size:12px;width:34px;text-align:right">50</span>
  </div>
  <div class="tabs"><button class="act" data-tab="queue">Queue</button><button data-tab="lyrics">Lyrics</button><button data-tab="search">Search</button></div>
  <div id="tab-lyrics" hidden><div class="lyr" id="lyr"><div class="empty">No lyrics</div></div></div>
  <div id="tab-queue"><div class="list" id="queue"></div></div>
  <div id="tab-search" hidden>
    <input class="search" id="q" type="search" placeholder="Search songs, artists…" enterkeyhint="search" autocomplete="off">
    <div class="list" id="results" style="margin-top:10px"></div>
  </div>
</div>
<div id="pin"><div class="box"><b>Connect to Zenith</b><div style="color:var(--mut);font-size:13px;margin-top:6px">Enter the PIN, or scan the QR code again in Zenith → Plugins → Control by your internet</div><input class="search" id="pinin" inputmode="numeric" autocomplete="off"><button class="btn" id="pinok">Connect</button></div></div>
<div id="toast"></div>
<div id="sheet"><div class="box"><b>Sleep timer</b><div style="color:var(--mut);font-size:13px;margin-top:4px">Playback stops after</div><div class="opts"><button data-m="15">15 min</button><button data-m="30">30 min</button><button data-m="45">45 min</button><button data-m="60">1 h</button><button data-m="90">1.5 h</button><button data-m="0">Off</button></div></div></div>
<script>
let touchedAt=0;['touchstart','touchmove','wheel','pointerdown'].forEach(ev=>addEventListener(ev,()=>{touchedAt=Date.now()},{passive:true,capture:true}));
// only ever moves the list's own scrollbar, never the page, and leaves it alone while you are poking at the screen
function scrollWithin(box,el,center){if(!box||Date.now()-touchedAt<4000)return;if(box.scrollHeight<=box.clientHeight)return;const top=el.offsetTop-box.offsetTop;const want=center?top-(box.clientHeight-el.offsetHeight)/2:(top<box.scrollTop?top:top+el.offsetHeight>box.scrollTop+box.clientHeight?top+el.offsetHeight-box.clientHeight:box.scrollTop);box.scrollTo({top:Math.max(0,want),behavior:center?'smooth':'auto'})}

(()=>{
const $=id=>document.getElementById(id);
const ICON_PLAY='M8 5v14l11-7z',ICON_PAUSE='M6 19h4V5H6v14zm8-14v14h4V5h-4z';
const HEART_ON='M12 21.3l-1.4-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.3z';
const HEART_OFF=$('heart').getAttribute('d');
const VOL_ON=$('volpath').getAttribute('d'),VOL_OFF='M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.8 8.8 0 0 0 21 12c0-4.3-3-7.9-7-8.8v2.1c2.9.9 5 3.5 5 6.7zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3-9-9L4.3 3zM12 4 9.9 6.1 12 8.2V4z';
let pin=localStorage.getItem('zenithRemotePin')||'';
let key=localStorage.getItem('zenithRemoteKey')||'';
let lyr=null,lyrIdx=-2,lyrTimer=0;
const auth=()=>`pin=${encodeURIComponent(pin)}&key=${encodeURIComponent(key)}`;
let ws=null,st={},seeking=false,volDrag=false,raf=0,req=0,retry=0,lastQueueKey='';
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=u=>/^https:\/\//.test(u||'')?u:'';
const img=u=>{u=safeImg(u);return u?`<img loading="lazy" src="${esc(u)}" alt="">`:'<span class="ph"></span>'};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1600)}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function pos(){if(!st.isPlaying)return st.position||0;return Math.min(st.duration||0,(st.position||0)+(Date.now()-st.at)/1000)}
function setRange(el,v,max){el.value=v;el.style.setProperty('--p',(max?v/max*100:0)+'%')}
function tick(){raf=0;const d=st.duration||0,p=pos();if(!seeking){setRange($('seek'),d?Math.round(p/d*1000):0,1000);$('cur').textContent=fmt(p)}
 $('dur').textContent=fmt(d);if(st.isPlaying&&!document.hidden)raf=setTimeout(tick,500)}
function render(){
 const t=st.track;
 $('title').textContent=t?t.title:'Nothing playing';$('artist').textContent=t?t.artist:'\u00a0';
 const c=safeImg(t&&t.cover);$('cover').style.backgroundImage=c?`url("${c}")`:'';$('bgart').style.backgroundImage=c?`url("${c}")`:'';
 $('picon').firstChild.setAttribute('d',st.isPlaying?ICON_PAUSE:ICON_PLAY);
 $('heart').setAttribute('d',st.liked?HEART_ON:HEART_OFF);$('like').classList.toggle('on',!!st.liked);
 $('shuffle').classList.toggle('on',!!st.shuffle);
 $('volpath').setAttribute('d',st.muted?VOL_OFF:VOL_ON);
 if(!volDrag){const v=Math.round((st.volume??0.5)*100);setRange($('vol'),v,100);$('volv').textContent=v}
 const q=st.queue||[],off=st.queueOffset||0,key=q.map(x=>x.id).join()+'|'+st.queueIndex+'|'+off;
 if(key!==lastQueueKey){lastQueueKey=key;
  $('queue').innerHTML=q.length?q.map((x,i)=>`<button class="it${off+i===st.queueIndex?' cur':''}" data-i="${off+i}">${img(x.cover)}<div class="m"><div class="t">${esc(x.title)}</div><div class="s">${esc(x.artist)}</div></div></button>`).join(''):'<div class="empty">Queue is empty</div>';
  const cur=$('queue').querySelector('.cur');if(cur&&!$('tab-queue').hidden)scrollWithin($('queue'),cur,false)}
 const sl=st.sleepLeft||0;$('sleepbtn').classList.toggle('on',sl>0);$('sleeptxt').textContent=sl>0?'Stops in '+Math.ceil(sl/60)+' min':'Sleep timer';
 clearTimeout(raf);tick();lyrTick();
}
function renderLyrics(){
 const el=$('lyr');if(!lyr||lyr.trackId!==(st.track&&st.track.id)){el.innerHTML='<div class="empty">No lyrics</div>';return}
 if(lyr.synced&&lyr.synced.length)el.innerHTML=lyr.synced.map((l,i)=>`<p data-i="${i}">${esc(l.x)||'&#9834;'}</p>`).join('');
 else if(lyr.plain)el.innerHTML=`<pre>${esc(lyr.plain)}</pre>`;
 else el.innerHTML='<div class="empty">No lyrics</div>';
 lyrIdx=-2;lyrTick();
}
function lyrTick(){
 clearTimeout(lyrTimer);
 if($('tab-lyrics').hidden||document.hidden||!lyr||!lyr.synced||!lyr.synced.length)return;
 const p=pos()-0.35;let i=-1;for(let k=lyr.synced.length-1;k>=0;k--){if(p>=lyr.synced[k].t){i=k;break}}
 if(i!==lyrIdx){const ps=$('lyr').children;for(let k=0;k<ps.length;k++){ps[k].className=k===i?'on':k<i?'past':''}lyrIdx=i;const cur=ps[i];if(cur)scrollWithin($('lyr'),cur,true)}
 if(st.isPlaying)lyrTimer=setTimeout(lyrTick,250);
}
function connect(){
 const proto=location.protocol==='https:'?'wss':'ws';
 ws=new WebSocket(`${proto}://${location.host}/ws?${auth()}`);
 ws.onopen=()=>{retry=0;$('dot').classList.add('on');$('pin').classList.remove('show')};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
  if(m.type==='state'){st=m;st.at=Date.now();render()}
  else if(m.type==='lyrics'){lyr=m;lyrIdx=-2;renderLyrics()}
  else if(m.type==='search'&&m.req===req)showResults(m.items||[]);
  else if(m.type==='toast')toast(m.text)};
 ws.onclose=()=>{$('dot').classList.remove('on');ws=null;
  fetch('/api/state?'+auth()).then(r=>{if(r.status===401){$('pin').classList.add('show');$('pinin').focus()}else if(r.status===429){toast('Too many attempts, wait a minute');setTimeout(connect,60000)}else setTimeout(connect,Math.min(10000,500*2**retry++))}).catch(()=>setTimeout(connect,Math.min(10000,500*2**retry++)))};
}
function showResults(items){
 $('results').innerHTML=items.length?items.map((x,i)=>`<div class="it" data-r="${i}">${img(x.cover)}<div class="m"><div class="t">${esc(x.title)}</div><div class="s">${esc(x.artist)}</div></div><div class="acts"><button data-a="playTrack" aria-label="Play"><svg viewBox="0 0 24 24"><path d="${ICON_PLAY}"/></svg></button><button data-a="playNextTrack" aria-label="Play next"><svg viewBox="0 0 24 24"><path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/></svg></button><button data-a="addTrack" aria-label="Add to queue"><svg viewBox="0 0 24 24"><path d="M14 10H3v2h11v-2zm0-4H3v2h11V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM3 16h7v-2H3v2z"/></svg></button></div></div>`).join(''):'<div class="empty">No results</div>';
 $('results')._items=items;
}
$('toggle').onclick=()=>{st.isPlaying=!st.isPlaying;st.position=pos();st.at=Date.now();render();send({cmd:'toggle'})};
// tap = previous / next, press and hold = scrub backwards / forwards (5 s steps)
function holdBtn(el,dir,tap){let t=0,iv=0,scrubbed=false;
 const stop=()=>{clearTimeout(t);clearInterval(iv);el.classList.remove('scrub');t=0;iv=0};
 el.addEventListener('pointerdown',e=>{e.preventDefault();scrubbed=false;try{el.setPointerCapture(e.pointerId)}catch{}
  t=setTimeout(()=>{scrubbed=true;el.classList.add('scrub');const step=()=>{const d=st.duration||0;const v=Math.max(0,Math.min(d?d-1:0,pos()+dir*5));st.position=v;st.at=Date.now();tick();send({cmd:'seek',value:v})};step();iv=setInterval(step,300)},450)});
 el.addEventListener('pointerup',()=>{const was=scrubbed;stop();if(!was)tap()});
 el.addEventListener('pointercancel',stop);el.addEventListener('contextmenu',e=>e.preventDefault())}
holdBtn($('next'),1,()=>send({cmd:'next'}));holdBtn($('prev'),-1,()=>send({cmd:'prev'}));
$('sleepbtn').onclick=()=>$('sheet').classList.add('show');
$('sheet').onclick=e=>{const b=e.target.closest('[data-m]');if(b){send({cmd:'sleep',minutes:+b.dataset.m});toast(+b.dataset.m?'Sleep timer: '+b.textContent:'Sleep timer off')}if(b||e.target.id==='sheet')$('sheet').classList.remove('show')};
$('like').onclick=()=>{send({cmd:'like'})};$('shuffle').onclick=()=>send({cmd:'shuffle'});$('mute').onclick=()=>send({cmd:'mute'});
const sk=$('seek');sk.oninput=()=>{seeking=true;setRange(sk,+sk.value,1000);$('cur').textContent=fmt(sk.value/1000*(st.duration||0))};
sk.onchange=()=>{const t=sk.value/1000*(st.duration||0);st.position=t;st.at=Date.now();seeking=false;send({cmd:'seek',value:t})};
const vl=$('vol');let vt=0;vl.oninput=()=>{volDrag=true;setRange(vl,+vl.value,100);$('volv').textContent=vl.value;const now=Date.now();if(now-vt>80){vt=now;send({cmd:'volume',value:vl.value/100})}};
vl.onchange=()=>{volDrag=false;send({cmd:'volume',value:vl.value/100})};
$('queue').onclick=e=>{const b=e.target.closest('[data-i]');if(b)send({cmd:'jump',index:+b.dataset.i})};
$('results').onclick=e=>{const b=e.target.closest('[data-a]'),row=e.target.closest('[data-r]');if(!row)return;const it=$('results')._items[+row.dataset.r];const a=b?b.dataset.a:'playTrack';send({cmd:a,track:it});toast(a==='playTrack'?'Playing':a==='addTrack'?'Added to queue':'Plays next')};
let qt=0;$('q').oninput=()=>{clearTimeout(qt);const v=$('q').value.trim();if(!v){showResults([]);return}qt=setTimeout(()=>{req++;send({cmd:'search',query:v,req})},350)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('act',x===b));$('tab-queue').hidden=b.dataset.tab!=='queue';$('tab-search').hidden=b.dataset.tab!=='search';$('tab-lyrics').hidden=b.dataset.tab!=='lyrics';if(b.dataset.tab==='lyrics'){lyrIdx=-2;lyrTick()}if(b.dataset.tab==='search')$('q').focus()});
$('pinok').onclick=()=>{pin=$('pinin').value.trim();localStorage.setItem('zenithRemotePin',pin);connect()};
$('pinin').onkeydown=e=>{if(e.key==='Enter')$('pinok').click()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(!ws)connect();render()}});
// one-time QR link: trade the token for a device key, then drop it from the address bar
(async()=>{const t=new URLSearchParams(location.search).get('pair');
 if(t){try{const r=await fetch('/api/pair?t='+encodeURIComponent(t));if(r.ok){const j=await r.json();key=j.key;localStorage.setItem('zenithRemoteKey',key);toast('Paired')}else if(!key){toast('This QR code was already used - scan the new one')}}catch{}
  history.replaceState(null,'','/')}
 connect()})();
})();
</script>
