[package]
name = "zenith-player"
version = "1.0.0"
description = "Independent desktop music player. Not affiliated with Google or YouTube."
authors = ["tonieninja"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/tonieninja/zenith-player"
repository = "https://github.com/tonieninja/zenith-player"

[lib]
name = "zenith_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Enables debug_write_dump for in-app QA harness builds only.
qa = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
lazy_static = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-http = { version = "2.5.9", features = ["unsafe-headers"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking", "json"] }
getrandom = "0.2"
sha1 = "0.10"
futures-util = "0.3"
discord-rich-presence = "0.2.5"
hidapi = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
